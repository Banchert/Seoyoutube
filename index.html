<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube AI Optimizer - Web App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
        }

        .logo {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2rem;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s;
            margin: 10px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .features {
            text-align: left;
            margin: 30px 0;
        }

        .feature {
            display: flex;
            align-items: center;
            margin: 15px 0;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .feature-icon {
            font-size: 1.5rem;
            margin-right: 15px;
        }

        .status {
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .videos-section {
            display: none;
            margin-top: 30px;
        }

        .video-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin: 10px 0;
        }

        .video-thumbnail {
            width: 80px;
            height: 60px;
            background: #f0f0f0;
            border-radius: 5px;
            margin-right: 15px;
        }

        .video-info {
            flex: 1;
            text-align: left;
        }

        .video-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .video-date {
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🎬</div>
        <h1>YouTube AI Optimizer</h1>
        <p class="subtitle">Optimize your videos with AI</p>

        <div class="features">
            <div class="feature">
                <span class="feature-icon">✨</span>
                <div>
                    <strong>AI-Generated SEO Content</strong><br>
                    Automatically creates optimized titles, descriptions, and tags
                </div>
            </div>
            <div class="feature">
                <span class="feature-icon">🎨</span>
                <div>
                    <strong>Custom Thumbnails</strong><br>
                    AI-powered thumbnail generation for better CTR
                </div>
            </div>
            <div class="feature">
                <span class="feature-icon">📊</span>
                <div>
                    <strong>Bulk Processing</strong><br>
                    Optimize multiple videos at once
                </div>
            </div>
        </div>

        <div id="auth-section">
            <button class="btn" onclick="login()">
                🔐 Login with Google
            </button>
            <button class="btn" onclick="installExtension()">
                🚀 Install Chrome Extension
            </button>
        </div>

        <div id="status" class="status"></div>

        <div id="videos-section" class="videos-section">
            <h3>Your YouTube Videos</h3>
            <div id="videos-list"></div>
            <button class="btn" onclick="optimizeSelected()">
                ✨ Optimize Selected Videos
            </button>
        </div>
    </div>

    <script>
        // Web App OAuth Configuration
        const CLIENT_ID = '862891517207-NEW_WEB_APP_CLIENT_ID.apps.googleusercontent.com';
        const REDIRECT_URI = window.location.origin + '/callback';
        const SCOPES = 'https://www.googleapis.com/auth/youtube.force-ssl https://www.googleapis.com/auth/youtube.upload';

        function login() {
            const authUrl = `https://accounts.google.com/oauth/authorize?` +
                `client_id=${CLIENT_ID}&` +
                `redirect_uri=${encodeURIComponent(REDIRECT_URI)}&` +
                `scope=${encodeURIComponent(SCOPES)}&` +
                `response_type=code&` +
                `access_type=offline`;
            
            window.location.href = authUrl;
        }

        function installExtension() {
            window.open('https://chrome.google.com/webstore/detail/youtube-ai-optimizer/EXTENSION_ID', '_blank');
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
        }

        function optimizeSelected() {
            showStatus('🚀 Starting AI optimization...', 'success');
            // Implement optimization logic
        }

        // Check for OAuth callback
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        
        if (code) {
            showStatus('✅ Authentication successful! Loading your videos...', 'success');
            document.getElementById('videos-section').style.display = 'block';
            document.getElementById('auth-section').style.display = 'none';
        }
    </script>
</body>
</html>
